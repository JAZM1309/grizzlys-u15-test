# Wird vom Admin-Bereich der App gestartet (Knopf „Test-Paket hochladen“) – nicht von Hand nötig.
name: Grizzlys Test hochladen
run-name: ${{ inputs.auftrag }}

on:
  workflow_dispatch:
    inputs:
      aktion:  { description: "hochladen oder neu", default: "hochladen", required: false }
      auftrag: { description: "Auftrag", default: "von Hand", required: false }
      aelter:  { description: "älteres Paket erlauben (ja/nein)", default: "nein", required: false }

permissions:
  contents: write
  pages: write

concurrency:
  group: grizzlys-veroeffentlichen
  cancel-in-progress: false

jobs:
  ablauf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Test-Repo laden
        uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Browser für die Lesbarkeitsprüfung
        if: inputs.aktion != 'neu'
        continue-on-error: true
        timeout-minutes: 6
        run: |
          pip install -q playwright pillow
          python3 -m playwright install --with-deps chromium >/dev/null
      - name: Paket übernehmen
        env:
          GH_TOKEN: ${{ github.token }}
          AKTION: ${{ inputs.aktion }}
          AELTER: ${{ inputs.aelter }}
        run: bash .github/werkzeug/test.sh
      - name: Prüfbericht ablegen
        if: always() && inputs.aktion != 'neu'
        uses: actions/upload-artifact@v4
        with: { name: lesbarkeit, path: "${{ runner.temp }}/pruefung", retention-days: 14, if-no-files-found: ignore }
